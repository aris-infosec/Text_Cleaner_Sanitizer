<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Text Cleaner &amp; Sanitizer</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f7f5,#121715);--pn:light-dark(#fff,#1a211e);--ink:light-dark(#1b2320,#e6ebe8);--mu:light-dark(#68736e,#8f9b95);--ln:light-dark(#d9dedb,#2c3631);--ac:light-dark(#0f6b57,#4fd1b0);--abg:light-dark(#d8efe8,#183a31);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif}
main{max-width:1560px;margin:0 auto;padding:22px 16px 40px}
header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 14px;max-width:75ch}
.grid,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.grid2{grid-template-columns:3fr 2fr}
@media(max-width:800px){.grid,.grid2{grid-template-columns:1fr}}
.box,.opts{background:var(--pn);border:1px solid var(--ln);border-radius:10px;min-width:0;display:flex;flex-direction:column}
.opts{padding:10px 12px;margin-bottom:14px;gap:6px;flex-direction:row;flex-wrap:wrap;align-items:center}
.bh{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--ln);gap:8px;flex-wrap:wrap}
.pad{padding:10px 12px;font-size:13px;overflow:auto;max-height:340px}
textarea,.out{flex:1;min-height:300px;width:100%;border:0;background:transparent;color:inherit;padding:12px;font:14px/1.6 ui-monospace,Consolas,Menlo,monospace;resize:vertical;outline:none;white-space:pre-wrap;word-break:break-word;overflow:auto}
mark{--h:0;background:hsl(var(--h) 85% 55%/.3);color:inherit;box-shadow:inset 0 -2px hsl(var(--h) 75% 45%);border-radius:3px;padding:0 2px;cursor:pointer}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:hsl(var(--h,0) 75% 48%);margin-right:5px}
button,select,input[type=text],textarea.s{font:inherit;font-size:13px;border:1px solid var(--ln);background:var(--pn);color:var(--ink);padding:5px 10px;border-radius:7px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.p{background:var(--ac);border-color:var(--ac);color:var(--bg);font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap}.stat,.mu{color:var(--mu);font-size:13px;font-weight:400}
.opts label{display:flex;gap:5px;align-items:center;border:1px solid var(--ln);border-radius:999px;padding:2px 10px 2px 7px;font-size:13px;cursor:pointer;user-select:none}
.opts label:has(input:checked){background:var(--abg);border-color:var(--ac)}
.gl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu);margin:0 4px 0 8px}
.rc{margin-bottom:10px}.chip{margin:2px 3px 2px 0;padding:1px 8px;border-radius:999px;font-size:12.5px;background:hsl(var(--h) 85% 55%/.18);border-color:hsl(var(--h) 60% 50%/.5)}
.note{color:var(--mu);font-size:12.5px;max-width:90ch}
dialog{width:min(640px,94vw);max-height:90vh;background:var(--pn);color:var(--ink);border:1px solid var(--ln);border-radius:12px;padding:16px}
dialog::backdrop{background:#0008}.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--ln);font-size:13.5px}
textarea.s{width:100%;min-height:54px;font-family:ui-monospace,monospace;resize:vertical}h3{margin:16px 0 6px;font-size:14px}
#cm{position:fixed;z-index:9;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px;box-shadow:0 8px 28px #0005;display:flex;flex-direction:column;gap:5px;min-width:230px;max-width:300px}
#cm[hidden],#toast[hidden]{display:none}#cm button{text-align:left}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;z-index:10}
dialog .pad{max-height:150px}h3.hr{display:flex;justify-content:space-between;align-items:center}
table.lt{width:100%;border-collapse:collapse;font-size:13px}.lt th{text-align:left;color:var(--mu);font-weight:500;position:sticky;top:0;background:var(--pn)}.lt td,.lt th{padding:3px 6px;border-bottom:1px solid var(--ln)}.lt tr.off td:first-child{text-decoration:line-through;opacity:.5}.lt button{padding:0 7px}

.shell{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:14px;align-items:start}
main.hide .shell{grid-template-columns:minmax(0,1fr)}main.hide .side{display:none}
.side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding:1px 3px 1px 1px;scrollbar-width:thin}
.work{display:flex;flex-direction:column;gap:14px;min-width:0}.work .grid,.work .grid2{margin:0}.work textarea,.work .out{min-height:380px}
@media(max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.side{position:static;max-height:none;overflow:visible}}
.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;min-width:0}
summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;user-select:none}summary::-webkit-details-marker{display:none}
summary::before{content:"";width:6px;height:6px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(-45deg);transition:transform .15s;flex:none;margin:0 3px 0 1px}
details[open]>summary::before{transform:rotate(45deg)}
.pn>summary{padding:11px 12px;font-weight:600;font-size:14.5px}.pn[open]>summary{border-bottom:1px solid var(--ln)}
.pn>summary .mu{margin-left:auto;font-size:12px}
.bd{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ac);background:var(--abg);border-radius:999px;padding:0 8px;min-width:22px;text-align:center}.bd:empty{display:none}
.pb{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px}
.sg{border-top:1px solid var(--ln)}.sg:first-of-type{border-top:0}.sg>summary{padding:8px 2px;font-size:13px;font-weight:600}
.opts2,.chipbox{padding:0 0 8px 16px}.opts2{display:flex;flex-direction:column;gap:3px}.chipbox{display:flex;flex-wrap:wrap;gap:5px}
.tg{display:flex;align-items:center;gap:9px;padding:2px 0;font-size:13.5px;cursor:pointer;line-height:1.35}
.tg input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:30px;height:17px;border-radius:99px;background:var(--ln);position:relative;margin:0;cursor:pointer;transition:background .15s}
.tg input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .15s}
.tg input:checked{background:var(--ac)}.tg input:checked::after{transform:translateX(13px)}
.nm{width:50px;padding:1px 4px;margin:0 3px;text-align:center;font:inherit;font-size:13px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--ink)}
.sl{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--mu);padding:3px 0}.sl select{width:100%}
.chipbox label{display:flex;gap:5px;align-items:center;border:1px solid var(--ln);border-radius:999px;padding:2px 10px 2px 7px;font-size:13px;cursor:pointer;user-select:none}
.chipbox label:has(input:checked){background:var(--abg);border-color:var(--ac)}
del{background:hsl(0 80% 55%/.22);text-decoration:line-through;border-radius:2px}ins{background:hsl(150 70% 40%/.28);text-decoration:none;border-radius:2px}#in.drop{outline:2px dashed var(--ac);outline-offset:-6px;background:var(--abg)}.credit{text-align:center;margin:18px auto 0;font-size:12px}.main-tg{padding:2px 0 4px;font-weight:600}
</style>
</head>
<body>
<main id="mn">
<header><div><h1 data-i="title"></h1><p class="sub" data-i="sub"></p></div><span class="btns"><button id="btog" data-i="tbtn"></button><button id="bsn" data-i="snap" hidden></button><button id="bset" data-i="set"></button></span></header>
<div class="shell">
<aside class="side">
 <div class="sh"><span data-i="tools"></span><span class="btns"><button id="eall" data-i="expand"></button><button id="call" data-i="collapse"></button></span></div>
 <details class="pn" open><summary><span data-i="t_clean"></span><span class="bd" id="bcl"></span></summary>
  <div class="pb"><div class="btns"><button data-pre="ws" data-i="pre_ws"></button><button data-pre="plain" data-i="pre_plain"></button><button data-pre="off" data-i="pre_off"></button></div>
  <div id="clean"></div><p class="note" data-i="cnote" style="margin:0"></p></div></details>
 <details class="pn" open><summary><span data-i="t_san"></span><span class="bd" id="bsa"></span></summary>
  <div class="pb"><label class="tg main-tg"><input type="checkbox" id="sanon"><span data-i="san_on"></span></label>
  <div class="btns"><button data-sa="all" data-i="sa_all"></button><button data-sa="none" data-i="sa_none"></button></div><div id="chips"></div></div></details>
</aside>
<div class="work">
<div class="grid">
 <section class="box"><div class="bh"><b data-i="orig"></b><span class="btns"><button id="bl" data-i="learnsel"></button><button id="s1">Sample</button><button id="s2">Beispiel</button><button id="openf" data-i="openf"></button><button id="clr" data-i="clear"></button><input type="file" id="inf" accept=".txt,.md,.csv,.json,.log,.html,.htm,.xml,.tsv,text/*" hidden></span></div>
 <textarea id="in" spellcheck="false"></textarea></section>
 <section class="box"><div class="bh"><span><b data-i="san"></b> <span class="stat" id="stat"></span></span><span class="btns"><select id="view"><option value="s" data-i="vs"></option><option value="d" data-i="vd"></option><option value="c" data-i="vc"></option><option value="b" data-i="vb"></option></select><button id="key" data-i="key"></button><button class="p" id="copy" data-i="copy"></button></span></div>
 <div class="out" id="out" aria-live="polite"></div></section>
</div>
<div class="grid2">
 <details class="pn" open><summary><b data-i="rep"></b><span class="mu" data-i="hint"></span></summary><div class="pad" id="rep"></div></details>
 <details class="pn" open><summary><b data-i="sts"></b></summary><div class="pad" id="sts"></div></details>
</div>
</div></div>
<p class="note credit">Created by Aris</p>
</main>
<dialog id="dlg"><div class="bh" style="border:0;padding:0"><b data-i="set"></b><button id="dx" data-i="close"></button></div><div id="sf"></div>
<h3 data-i="learn"></h3><div class="btns"><input type="text" id="lw" style="flex:1;min-width:140px"><select id="lc"></select><button class="p" id="la" data-i="add"></button></div>
<div id="ld" class="pad"></div><h3 data-i="rulesl"></h3><div id="rl" class="pad"></div>
<h3 class="hr"><span data-i="ignl"></span><button id="ri" data-i="restore"></button></h3><div id="il" class="pad"></div>
<h3 data-i="lib"></h3><p class="mu" data-i="libhint" style="margin:0 0 6px"></p><div class="btns"><select id="ls"></select><input type="text" id="lf" style="flex:1;min-width:110px"></div><div class="btns" style="margin:6px 0"><input type="text" id="lnw" style="flex:1;min-width:110px"><button class="p" id="lad">＋</button></div><div id="lr" class="pad" style="max-height:280px"></div>
<div class="btns" style="margin-top:12px"><button id="ex" data-i="exp"></button><button id="im" data-i="imp"></button><button id="rs" data-i="reset"></button><input type="file" id="imf" accept=".json" hidden></div></dialog>

<div id="cm" hidden><div id="cmw" class="mu"></div><select id="cmc"></select><button data-a="word" data-i="cm_word"></button><button data-a="fmt" data-i="cm_fmt"></button><button data-a="lab"></button><button data-a="ign" data-i="cm_ign"></button></div><div id="toast" hidden></div>
